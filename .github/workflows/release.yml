name: Release Build (macOS + Windows + Linux)

# 触发条件：
#   - push tag 形如 v0.1.0、v0.2.0：自动创建 release 并上传产物
#   - 手动触发（用于测试）
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write    # 创建 release / 上传产物需要
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            rust_target: aarch64-apple-darwin
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
            rust_target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
            rust_target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            args: ""
            rust_target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./apps/desktop/src-tauri -> target"
          key: ${{ matrix.platform }}-${{ matrix.rust_target }}

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsecret-1-dev \
            libssl-dev

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Inversion ${{ github.ref_name }}"
          releaseBody: |
            ## Inversion ${{ github.ref_name }}

            AI-powered decision pre-mortem tool.

            ### Downloads

            - **macOS (Apple Silicon)**: `.dmg` with "aarch64" in filename
            - **macOS (Intel)**: `.dmg` with "x64" in filename
            - **Windows**: `.msi` or `-setup.exe`
            - **Linux**: `.AppImage` or `.deb`

            ### First-time setup

            On launch, you'll be asked to provide a DeepSeek API key (BYOK mode).
            Get a free-tier key at https://platform.deepseek.com/api_keys

            Your key is stored in the OS keychain (macOS Keychain / Windows Credential
            Manager / Linux Secret Service) and never uploaded.

            ### Full guide

            See `apps/desktop/ALPHA-USER-GUIDE.md` in the repo.
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}

  # PR / push 到 main 时只跑 lint check，省 CI 时间
  check:
    runs-on: ubuntu-22.04
    if: github.event_name != 'push' || (!startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./apps/desktop/src-tauri -> target"

      - name: Install Linux deps for cargo check
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libsecret-1-dev \
            libssl-dev

      - name: Install npm deps
        working-directory: apps/desktop
        run: npm install

      - name: Cargo check
        working-directory: apps/desktop/src-tauri
        run: cargo check --no-default-features
