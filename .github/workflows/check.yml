name: Quick Check

# 每次 push / PR 到 main 跑：cargo check + npm install
# 仅在 Linux 跑（最便宜），跨平台 build 留给 release.yml
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./apps/desktop/src-tauri -> target"

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libsecret-1-dev \
            libssl-dev \
            librsvg2-dev

      - name: Install npm deps
        working-directory: apps/desktop
        run: npm install

      - name: Cargo check (no GUI, fast)
        working-directory: apps/desktop/src-tauri
        run: cargo check

      - name: Verify landing page assets
        working-directory: apps/landing
        run: |
          test -f index.html
          test -f server.js
          test -f api/chat.js
          echo "✓ Landing page assets present"
